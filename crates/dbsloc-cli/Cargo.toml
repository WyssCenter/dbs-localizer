[package]
name = "dbsloc-cli"
version.workspace = true
edition = "2021"
description = "Wyss DBS Localizer command-line tool (native, no Python required)"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "dbsloc"
path = "src/main.rs"

[features]
default = ["pacer"]
pacer = ["dbsloc-pipeline/pacer"]

[dependencies]
dbsloc-pipeline = { path = "../dbsloc-pipeline", default-features = false }
dbsloc-checkreg = { path = "../dbsloc-checkreg", features = ["pair"] }
dbsloc-connectome = { path = "../dbsloc-connectome" }
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
ctrlc = "3"
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
