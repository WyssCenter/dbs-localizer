<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wyss DBS Localizer</title>
    <!-- Build the wasm binary with wasm-bindgen; `data-wasm-opt="z"` shrinks it. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1f;
        overflow: hidden;
      }
      #dbsloc_canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <!-- eframe's `WebRunner` paints into this canvas; see `crates/dbsloc-web/src/main.rs`. -->
    <canvas id="dbsloc_canvas" tabindex="0"></canvas>
  </body>
</html>
