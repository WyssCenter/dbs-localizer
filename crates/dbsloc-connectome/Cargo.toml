[package]
name = "dbsloc-connectome"
version.workspace = true
publish = false
edition = "2021"
description = "Wyss DBS Localizer connectome readers: structural data.mat and TrackVis fibres, functional time-course folders, multi-tract folders and a fibre spatial index"
license = "GPL-3.0-only"

[lib]
name = "dbsloc_connectome"
path = "src/lib.rs"

[dependencies]
fastwarp-matfile = { path = "../../fastwarp/crates/fastwarp-matfile" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
