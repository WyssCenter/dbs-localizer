[package]
name = "dbsloc-api"
version.workspace = true
publish = false
edition = "2021"
description = "Shared DTOs for the Wyss DBS Localizer GPU server and browser client (native + wasm32)"
license = "GPL-3.0-only"

[lib]
name = "dbsloc_api"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
dbsloc-protocol = { path = "../dbsloc-protocol" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dbsloc-pipeline = { path = "../dbsloc-pipeline", default-features = false }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
