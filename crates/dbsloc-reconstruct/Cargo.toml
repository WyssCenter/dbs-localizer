[package]
name = "dbsloc-reconstruct"
version.workspace = true
publish = false
edition = "2021"
description = "TRAC/CORE and native-frame CT reconstruction algorithms and the electrode catalogue (Phase C)"
license = "GPL-3.0-only"

[lib]
name = "dbsloc_reconstruct"
path = "src/lib.rs"

[dependencies]
fastwarp-core = { path = "../../fastwarp/crates/fastwarp-core" }
ndarray = "0.17"
rayon = "1.10"
nalgebra = "0.35"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
