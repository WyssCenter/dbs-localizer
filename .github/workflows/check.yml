name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".claude/**"
      - ".vscode/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$CHANGED" -le 3000 ]; then
            if other=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty) | select(test("\\.md\\z|\\Adocs/|\\Aspecs/|\\A\\.claude/|\\A\\.vscode/|\\ALICENSE\\z|\\ANOTICE\\z") | not)') && [ -z "$other" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  python:
    name: Python lint and tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check dbsloc/ tests/ scripts/ docs/conf.py
          uv run ruff format --check dbsloc/ tests/ scripts/ docs/conf.py

      - name: ty
        run: uv run ty check dbsloc/

      - name: Pytest without the slow tests
        run: uv run pytest -m "not slow"

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - run: cargo fmt --all --check

      - run: cargo fmt --manifest-path fastwarp/Cargo.toml --all --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy fastwarp workspace
        run: cargo clippy --locked --manifest-path fastwarp/Cargo.toml --target-dir target --workspace --all-targets --features fastwarp-gpu/dev-tools -- -D warnings

      - name: Clippy fastwarp fastwarp-gpu without the developer tools
        run: cargo clippy --locked --manifest-path fastwarp/Cargo.toml --target-dir target -p fastwarp-gpu --all-targets -- -D warnings

      - name: Clippy dbsloc-pipeline (PyO3 binding)
        run: cargo clippy --locked -p dbsloc-pipeline --all-targets --features pyo3 -- -D warnings

      - name: Clippy without PaCER (GPL-3.0-only build, no AGPL-3.0-only crate)
        run: cargo clippy --locked -p dbsloc-pipeline -p dbsloc-cli --all-targets --no-default-features -- -D warnings

      - name: Clippy dbsloc-viz viewers
        run: |
          cargo clippy --locked -p dbsloc-viz --all-targets --features checkreg-viewer -- -D warnings
          cargo clippy --locked -p dbsloc-viz --all-targets --features scene-viewer -- -D warnings

  rust-tests:
    name: Rust unit tests
    needs: [changes, python, rust-lint]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.python.result == 'success' && needs.rust-lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBSLOC_SKIP_EXT_BIN_PREREQ: "1"
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
      DBSLOC_GPU_REQUIRE_ADAPTER: "1"
      FASTWARP_GPU_REQUIRE_ADAPTER: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
    steps:
      - name: Free disk space
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev-test
          cache-on-failure: true

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest

      - name: Install Mesa Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cargo test
        run: cargo nextest run --locked --workspace --profile ci

      - name: Cargo test without PaCER (GPL-3.0-only build)
        shell: bash
        run: |
          tree=$(cargo tree --locked -p dbsloc-cli -p dbsloc-app -p dbsloc-server -e all --prefix none)
          grep -q '^dbsloc-pacer ' <<<"$tree" || { echo "::error::the default build lost dbsloc-pacer"; exit 1; }
          tree=$(cargo tree --locked --no-default-features -p dbsloc-cli -p dbsloc-app -p dbsloc-server -e all --prefix none)
          if grep -q '^dbsloc-pacer ' <<<"$tree"; then echo "::error::dbsloc-pacer (AGPL-3.0-only) is in the --no-default-features build"; exit 1; fi
          cargo nextest run --locked --no-default-features --profile ci -p dbsloc-pipeline -p dbsloc-server --lib
          cargo nextest run --locked --no-default-features --profile ci -p dbsloc-cli --test cli_run_options
          cargo nextest run --locked --no-default-features --profile ci -p dbsloc-server --test runs_api

      - name: Cargo test fastwarp
        env:
          DBSLOC_ATLAS_INDEX_MAT: "${{ github.workspace }}/resources/atlases/leaddbs/DISTAL Minimal (Ewert 2017)/atlas_index.mat"
        run: cargo nextest run --locked --manifest-path fastwarp/Cargo.toml --target-dir target --workspace --exclude fastwarp-py --features fastwarp-gpu/dev-tools --profile ci
