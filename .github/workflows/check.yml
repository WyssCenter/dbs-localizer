name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".claude/**"
      - ".vscode/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".claude/**"
      - ".vscode/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check dbsloc/ tests/ scripts/
          uv run ruff format --check dbsloc/ tests/ scripts/

      - name: ty
        run: uv run ty check dbsloc/

      - name: Pytest without the slow tests
        run: uv run pytest -m "not slow"

  rust-lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - run: cargo fmt --all --check

      - run: cargo fmt --manifest-path fastwarp/Cargo.toml --all --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy fastwarp workspace
        run: cargo clippy --locked --manifest-path fastwarp/Cargo.toml --target-dir target --workspace --all-targets --features fastwarp-gpu/dev-tools -- -D warnings

      - name: Clippy fastwarp fastwarp-gpu without the developer tools
        run: cargo clippy --locked --manifest-path fastwarp/Cargo.toml --target-dir target -p fastwarp-gpu --all-targets -- -D warnings

      - name: Clippy dbsloc-pipeline (PyO3 binding)
        run: cargo clippy --locked -p dbsloc-pipeline --all-targets --features pyo3 -- -D warnings

      - name: Clippy dbsloc-viz viewers
        run: |
          cargo clippy --locked -p dbsloc-viz --all-targets --features checkreg-viewer -- -D warnings
          cargo clippy --locked -p dbsloc-viz --all-targets --features scene-viewer -- -D warnings

  rust-tests:
    name: Rust unit tests
    needs: [python, rust-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBSLOC_SKIP_EXT_BIN_PREREQ: "1"
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
      DBSLOC_GPU_REQUIRE_ADAPTER: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
    steps:
      - name: Free disk space
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev-test
          cache-on-failure: true

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      - name: Install Mesa Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cargo test
        run: cargo nextest run --locked --workspace --profile ci

      - name: Cargo test fastwarp
        env:
          DBSLOC_ATLAS_INDEX_MAT: "${{ github.workspace }}/resources/atlases/leaddbs/DISTAL Minimal (Ewert 2017)/atlas_index.mat"
        run: cargo nextest run --locked --manifest-path fastwarp/Cargo.toml --target-dir target --workspace --exclude fastwarp-py --features fastwarp-gpu/dev-tools --profile ci
